name: Contract Fuzz

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contract-fuzz.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entrypoint-fuzz:
    name: Entrypoint fuzz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('contracts/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-
            ${{ runner.os }}-cargo-

      - name: Run bounded PR fuzzing
        if: github.event_name == 'pull_request'
        env:
          PROPTEST_CASES: "64"
        run: cargo test -p tipz-contract fuzz_ -- --nocapture

      - name: Run nightly fuzzing
        if: github.event_name != 'pull_request'
        env:
          PROPTEST_CASES: "1024"
        run: cargo test -p tipz-contract fuzz_ -- --nocapture
