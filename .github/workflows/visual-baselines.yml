name: Visual Baselines

# Regenerates the screenshot baselines inside the same container the
# comparison job uses, then proves they are stable by re-running the suite
# three times before committing. Triggered by a maintainer adding the
# `visual-baselines:update` label to a PR after reviewing the diffs, or
# manually for a branch. Fork PRs cannot be pushed to, so they receive the
# PNGs as an artifact to commit instead.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to regenerate baselines on
        required: true
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: visual-baselines-${{ github.event.pull_request.head.ref || inputs.ref }}
  cancel-in-progress: false

jobs:
  update-baselines:
    name: Regenerate screenshot baselines
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'visual-baselines:update'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CI: "true"
      HOME: /root
    defaults:
      run:
        working-directory: frontend-scaffold

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || inputs.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-scaffold/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Regenerate baselines
        run: npx playwright test -c playwright.visual.config.ts --update-snapshots

      - name: Verify the new baselines are stable (3 runs each)
        run: npx playwright test -c playwright.visual.config.ts --repeat-each 3

      - name: Upload baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: frontend-scaffold/tests/visual/__screenshots__/
          retention-days: 14

      - name: Commit and push
        id: push
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Baselines are already up to date."
          else
            git commit -m "test(visual): regenerated screenshot baselines"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report back on the pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const sameRepo = context.payload.pull_request.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const ok = '${{ job.status }}' === 'success';
            const changed = '${{ steps.push.outputs.changed }}' === 'true';
            let body;
            if (!ok) {
              body = 'Visual baseline regeneration failed: the new screenshots were not stable across three runs or the suite errored. See the workflow log; fix the non-determinism before updating baselines.';
            } else if (sameRepo) {
              body = changed
                ? 'Visual baselines were regenerated in the pinned container and pushed to this branch. Review the new PNGs in the diff before approving.'
                : 'Visual baselines are already up to date; nothing was pushed.';
            } else {
              body = 'Visual baselines were regenerated in the pinned container. This PR comes from a fork, so download the `visual-baselines` artifact from this workflow run, copy it to `frontend-scaffold/tests/visual/__screenshots__/` and commit it to the PR branch.';
            }
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            await github.rest.issues.removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, name: 'visual-baselines:update' }).catch(() => undefined);
