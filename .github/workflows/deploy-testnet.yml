name: Deploy Testnet

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'contracts/**'

permissions:
  contents: write

jobs:
  deploy-testnet:
    name: Deploy Contract to Testnet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-deploy-${{ hashFiles('contracts/**/Cargo.lock') }}

      - name: Cache soroban CLI
        id: cache-soroban
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/soroban
          key: ${{ runner.os }}-soroban

      - name: Install soroban CLI
        if: steps.cache-soroban.outputs.cache-hit != 'true'
        run: cargo install --locked soroban-cli

      - name: Build optimized WASM
        run: |
          cd contracts
          cargo build --target wasm32-unknown-unknown --release
          soroban contract optimize \
            --wasm target/wasm32-unknown-unknown/release/tipz_contract.wasm

      - name: Deploy to testnet
        id: deploy
        env:
          NATIVE_TOKEN_ID: ${{ vars.NATIVE_TOKEN_ID || 'CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC' }}
        run: |
          OUTPUT=$(./scripts/deploy-testnet.sh --optimized)
          echo "Deployment output:"
          echo "$OUTPUT"
          CONTRACT_ID=$(echo "$OUTPUT" | grep "Contract ID:" | tail -1 | awk '{print $NF}')
          echo "contract_id=$CONTRACT_ID" >> $GITHUB_OUTPUT
          DEPLOYER_ADDR=$(echo "$OUTPUT" | grep "Deployer address:" | tail -1 | awk '{print $NF}')
          test -n "$DEPLOYER_ADDR"
          echo "deployer=$DEPLOYER_ADDR" >> $GITHUB_OUTPUT

      - name: Generate contract bindings
        run: |
          soroban contract bindings typescript \
            --id ${{ steps.deploy.outputs.contract_id }} \
            --network testnet \
            --output-dir frontend-scaffold/src/bindings || \
          echo "Warning: Binding generation failed (may not be supported in this soroban version)"

      - name: Verify on-chain code hash and contract version
        env:
          CONTRACT_ID: ${{ steps.deploy.outputs.contract_id }}
        run: |
          test -n "$CONTRACT_ID"
          bash scripts/verify-contract-deployment.sh "$CONTRACT_ID" \
            contracts/target/wasm32-unknown-unknown/release/tipz_contract.optimized.wasm \
            testnet 4

      - name: Record verified deployment address and artifact
        env:
          CONTRACT_ID: ${{ steps.deploy.outputs.contract_id }}
          DEPLOYER: ${{ steps.deploy.outputs.deployer }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p deployments
          node --input-type=module -e '
            import fs from "node:fs";
            import crypto from "node:crypto";
            const response = await fetch("https://soroban-testnet.stellar.org", {
              method: "POST", headers: { "content-type": "application/json" },
              body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "getLatestLedger" }),
              signal: AbortSignal.timeout(15000)
            });
            if (!response.ok) throw new Error("Could not retrieve testnet ledger");
            const ledger = (await response.json()).result?.sequence;
            if (!Number.isSafeInteger(ledger) || ledger < 1) throw new Error("Invalid testnet ledger");
            const wasm = fs.readFileSync("contracts/target/wasm32-unknown-unknown/release/tipz_contract.optimized.wasm");
            const record = { network: "testnet", contractId: process.env.CONTRACT_ID,
              wasmSha256: crypto.createHash("sha256").update(wasm).digest("hex"),
              sourceCommit: process.env.SOURCE_SHA, deployer: process.env.DEPLOYER || null,
              interfaceVersion: 4, verifiedAtLedger: ledger };
            fs.writeFileSync("deployments/testnet.json", JSON.stringify(record, null, 2) + "\n");
          '

      - name: Commit deployment artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployments/testnet.json frontend-scaffold/src/bindings 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: record verified testnet contract and bindings [skip ci]"
          git push

      - name: Store deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            contracts/target/wasm32-unknown-unknown/release/*.wasm
            contracts/target/wasm32-unknown-unknown/release/*.optimized.wasm
          retention-days: 30

