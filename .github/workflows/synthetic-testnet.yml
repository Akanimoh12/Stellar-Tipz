name: Synthetic Stellar Testnet Tip
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: synthetic-testnet
    env:
      STELLAR_NETWORK: TESTNET
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      SYNTHETIC_TESTNET_SECRET: ${{ secrets.SYNTHETIC_TESTNET_SECRET }}
      SYNTHETIC_RECIPIENT: ${{ vars.SYNTHETIC_RECIPIENT }}
      SYNTHETIC_CONTRACT_ID: ${{ vars.SYNTHETIC_CONTRACT_ID }}
      SYNTHETIC_API_URL: ${{ vars.SYNTHETIC_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Submit, confirm, index and fetch synthetic tip
        run: node scripts/synthetic-tip.mjs
        working-directory: backend
      - name: Report failing stage
        if: failure()
        run: echo "::error::Synthetic tip failed; inspect JSON stage log and page testnet on-call"
