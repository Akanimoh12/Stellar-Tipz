name: E2E Tests

on:
  push:
    branches: [main, test-implement-drips]
    paths:
      - 'frontend-scaffold/**'
      - 'Dockerfile.frontend'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-tests.yml'

  pull_request:
    # #1342: the financial E2E suite must run on every PR. PRs in this repo
    # target `test-implement-drips` as well as `main`, so both are listed.
    branches: [main, test-implement-drips]
    paths:
      - 'frontend-scaffold/**'
      - 'Dockerfile.frontend'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-tests.yml'

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: frontend-scaffold

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-scaffold/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        # PR CI runs chromium only for speed (5 projects -> 1, ~50m -> ~10m).
        # Full cross-browser (chromium, firefox, webkit, Mobile Chrome/Safari)
        # runs on main/nightly. Mobile viewport emulation in mobile.spec.ts
        # already covers Pixel/iPhone viewports via setViewportSize.
        run: npx playwright test --project=chromium

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend-scaffold/playwright-report/
          retention-days: 30

      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: frontend-scaffold/test-results/
          retention-days: 30