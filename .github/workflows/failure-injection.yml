name: Backend Failure Injection

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/FAILURE_INJECTION.md'
      - '.github/workflows/failure-injection.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docs/FAILURE_INJECTION.md'
      - '.github/workflows/failure-injection.yml'

permissions:
  contents: read

jobs:
  failure-injection:
    name: Failure injection checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tipz_test
          POSTGRES_PASSWORD: tipz_test
          POSTGRES_DB: tipz_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U tipz_test -d tipz_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://tipz_test:tipz_test@localhost:5433/tipz_test
      REDIS_URL: redis://localhost:6380
      FAILURE_INJECTION_TEST_ENV: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run failure injection checks
        run: npm run test:failure-injection
