name: SAST

# Static analysis of first-party code. This complements `security-audit.yml`,
# which only covers dependency vulnerabilities — it cannot catch injection,
# unsafe API usage, or hardcoded secrets in our own source.
#
# CodeQL is used because it is GitHub-native: results land in the Security tab
# (code scanning) and the analysis shows up as a check that can gate merges.
#
# Ruleset policy: the default `security-extended` suite is intentionally too
# noisy to enforce on day one (it reports style and maintainability issues as
# security findings). We start from the high-confidence `security-and-quality`
# suite, then narrow to `security` only. See docs/SAST.md for the tuning
# rationale and the suppression register.
#
# Only the languages we actually ship are scanned. The backend is TypeScript
# (Node/Express) and the contracts are Rust (Soroban).

on:
  push:
    branches: [test-implement-drips]
  pull_request:
    branches: [test-implement-drips]
  schedule:
    # Weekly, so drift in a newly merged dependency or rule update is caught
    # even if no PR touches the scanned paths.
    - cron: "27 4 * * 1"
  workflow_dispatch:

# `security-events: write` is required to upload results; `actions: read` is
# required for the CodeQL action to resolve the private-repo API.
permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-typescript:
    name: SAST (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only needed so CodeQL can resolve the npm workspace layout; the analysis
      # itself is compiled from source by the extractor, not run.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize CodeQL (JavaScript/TypeScript)
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Tune the ruleset rather than accepting the default, but do it by
          # excluding queries rather than naming a `security` pack: there is no
          # standalone pack of that name for any language here, and requesting
          # one fails at `database init` with
          # "Query pack security cannot be found".
          #
          # Instead we keep the default suite and exclude the query tags that
          # produce non-security noise. `maintainability` and `usability` are
          # the style/design queries; `experimental` and `external/cwe` are
          # lower-confidence. What remains is the high-confidence
          # security-focused set — injection, hardcoded secrets, unsafe
          # deserialisation, path traversal, SSRF, XSS, and crypto misuse.
          queries: security-and-quality
          query-filters:
            - exclude:
                tags:
                  - maintainability
                  - usability
                  - experimental
                  - external/cwe

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          # Upload even when the analysis finds problems, so they appear in the
          # Security tab. `category` keeps TS and Rust results distinguishable
          # and lets branch protection require them independently.
          category: "/language:javascript-typescript"
          output: sarif-results
          upload: always

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-sarif-typescript
          path: frontend-scaffold/results/*.sarif
          if-no-files-found: warn
          retention-days: 30

  analyze-rust:
    name: SAST (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize CodeQL (Rust)
        uses: github/codeql-action/init@v3
        with:
          languages: rust
          # Same tuning as TypeScript: keep the default suite, drop the
          # non-security query tags. See the comment in the TypeScript job for
          # why this is expressed as a filter rather than `queries: security`.
          queries: security-and-quality
          query-filters:
            - exclude:
                tags:
                  - maintainability
                  - usability
                  - experimental
                  - external/cwe

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"
          output: sarif-results
          upload: always

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-sarif-rust
          path: contracts/results/*.sarif
          if-no-files-found: warn
          retention-days: 30
