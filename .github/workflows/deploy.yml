name: Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Preview
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-frontend-deploy.yml
    with:
      deployment_mode: preview
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-production:
    name: Deploy Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-frontend-deploy.yml
    with:
      deployment_mode: production
      environment_url: https://stellar-tipz.vercel.app
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  verify-deployment:
    name: Post-Deployment Verification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-production]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://stellar-tipz.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Run smoke tests
        env:
          DEPLOYMENT_URL: https://stellar-tipz.vercel.app
        run: npx tsx scripts/verify-deployment.ts

      - name: Trigger rollback on failure
        if: failure()
        run: |
          echo "::error::Deployment verification failed, triggering rollback"
          npx vercel rollback --token="$VERCEL_TOKEN" --yes

  rollback:
    name: Rollback
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [deploy-production]
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rollback Vercel deployment
        run: |
          npx vercel rollback --token="$VERCEL_TOKEN" --yes
          echo "Rolled back to previous deployment"
