name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  migration-safety:
    name: Migration Safety
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d migration_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migration_test?schema=public
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check for migration acknowledgement
        id: acknowledgement
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map((label) => label.name);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const acknowledged = labels.includes('migration-approved') || comments.some((comment) =>
              /(^|\s)\/migration-ack(?:\s|$)/i.test(comment.body || '')
            );
            core.setOutput('acknowledged', String(acknowledged));

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate migration diff
        working-directory: backend
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --script > migration-diff.sql

      - name: Scan migrations and estimate lock risk
        env:
          MIGRATION_ACKNOWLEDGED: ${{ steps.acknowledgement.outputs.acknowledged }}
        run: node scripts/check-migrations.mjs

      - name: Apply full migration history to production-like PostgreSQL
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Seed migration rehearsal database
        working-directory: backend
        run: npx prisma db seed

      - name: Rehearse newest migration rollback
        env:
          PGDATABASE_URL: postgresql://postgres:postgres@localhost:5432/migration_test
        run: |
          latest=$(find backend/prisma/migrations -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)
          test -f "$latest/down.sql"
          before=$(psql "$PGDATABASE_URL" -Atc "SELECT COALESCE(string_agg(relname, ',' ORDER BY relname), '') FROM pg_class WHERE relkind IN ('r', 'v', 'm') AND relnamespace = 'public'::regnamespace")
          psql "$PGDATABASE_URL" -v ON_ERROR_STOP=1 -f "$latest/down.sql"
          after=$(psql "$PGDATABASE_URL" -Atc "SELECT COALESCE(string_agg(relname, ',' ORDER BY relname), '') FROM pg_class WHERE relkind IN ('r', 'v', 'm') AND relnamespace = 'public'::regnamespace")
          test "$before" != "$after"

  contract:
    name: Contract Checks
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.lock') }}

      - name: Formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Tests
        run: cargo test

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: frontend-scaffold

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-scaffold/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
