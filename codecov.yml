coverage:
  precision: 2
  round: down
  range: "60...100"

  status:
    project:
      default:
        target: 70%
        threshold: 5%
        # A missing report must not silently pass. Coverage uploads are
        # best-effort (see fail_ci_if_error in .github/workflows/coverage.yml)
        # but the local ratchet in scripts/check-coverage.mjs is the real gate.
        if_not_found: error
        if_ci_failed: error
      backend:
        flags:
          - backend
        target: 50%
        threshold: 2%
        if_not_found: error
        if_ci_failed: error
      typescript:
        flags:
          - typescript
        target: 57%
        threshold: 2%
        if_not_found: error
        if_ci_failed: error
    patch:
      default:
        target: 80%
        threshold: 5%
        if_not_found: success
        if_ci_failed: error

  flags:
    backend:
      paths:
        - backend/src/
      carryforward: true
    typescript:
      paths:
        - frontend-scaffold/src/
      carryforward: true
    rust:
      paths:
        - contracts/
      carryforward: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "frontend-scaffold/src/test/**"
  - "frontend-scaffold/src/**/__tests__/**"
  - "frontend-scaffold/src/**/*.test.ts"
  - "frontend-scaffold/src/**/*.test.tsx"
  - "backend/tests/**"
  - "backend/src/**/__tests__/**"
  - "backend/src/**/*.test.ts"
  - "backend/prisma/seed.ts"
  - "contracts/tipz/src/test/**"
  - "e2e/**"
