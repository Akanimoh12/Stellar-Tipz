# Example scrape configuration for the three Stellar Tipz backend processes.
# Each process serves GET /metrics on METRICS_HOST:METRICS_PORT (default
# 127.0.0.1:9464). Give every process its own port when they share a host, or
# set METRICS_HOST=0.0.0.0 together with METRICS_BEARER_TOKEN and scrape over
# the network. See backend/docs/METRICS.md.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: stellar-tipz-api
    static_configs:
      - targets: ['127.0.0.1:9464']
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/tipz-metrics-token

  - job_name: stellar-tipz-indexer
    static_configs:
      - targets: ['127.0.0.1:9465']

  - job_name: stellar-tipz-jobs
    static_configs:
      - targets: ['127.0.0.1:9466']
